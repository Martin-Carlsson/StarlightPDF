[package]
name = "starlightpdf-fuzz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13" # libFuzzer runtime: the standard coverage-guided fuzzer for Rust; large to write here.
starlightpdf = { path = "../core" }

[[bin]]
name = "encrypted-open"
path = "fuzz_targets/encrypted_open.rs"
test = false

[[bin]]
name = "filters"
path = "fuzz_targets/filters.rs"
test = false

[[bin]]
name = "header-version"
path = "fuzz_targets/header_version.rs"
test = false

[[bin]]
name = "jpeg"
path = "fuzz_targets/jpeg.rs"
test = false

[[bin]]
name = "png"
path = "fuzz_targets/png.rs"
test = false

[[bin]]
name = "page-count"
path = "fuzz_targets/page_count.rs"
test = false

[[bin]]
name = "xref-stream-flate"
path = "fuzz_targets/xref_stream_flate.rs"
test = false

[[bin]]
name = "rebuild"
path = "fuzz_targets/rebuild.rs"
test = false

[lints]
workspace = true
