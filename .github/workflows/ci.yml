name: Continuous integration
on:
  pull_request:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  URL: ${{ github.server_url }}/${{ github.repository }}
jobs:
  changes:
    name: Find the areas to check
    runs-on: ubuntu-latest
    outputs:
      areas: ${{ steps.areas.outputs.areas }}
      changed: ${{ steps.areas.outputs.changed }}
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Find the nightly date
        id: date
        run: |
          date=$(date -u -d '22 hours ago' +%F)
          echo "date=${date}" >>"${GITHUB_OUTPUT}"
      - name: Check out
        run: |
          git init -q .
          git config core.autocrlf false
          git fetch -q --depth=2 "${URL}" "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD
      - name: List changed files and their areas
        id: areas
        run: |
          if [[ "${GITHUB_EVENT_NAME}" = pull_request ]]; then
            changed=$(git -c core.quotePath=false diff --no-renames --name-only HEAD^ HEAD)
          else
            changed=$(git -c core.quotePath=false ls-files)
          fi
          areas=$(printf '%s' "${changed}" | sh ci/areas.sh)
          printf 'changed<<END-%s\n%s\nEND-%s\n' "${GITHUB_RUN_ID}" "${changed}" "${GITHUB_RUN_ID}" >>"${GITHUB_OUTPUT}"
          json=$(printf '%s' "${areas}" | awk 'NR > 1 { printf "," } { printf "\"%s\"", $0 }')
          echo "areas=[${json}]" >>"${GITHUB_OUTPUT}"
  check:
    name: Check ${{ matrix.area }} on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.areas != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        area: ${{ fromJSON(needs.changes.outputs.areas) }}
        exclude:
          - { os: macos-latest, area: licenses }
          - { os: windows-latest, area: licenses }
          - { os: macos-latest, area: dependencies }
          - { os: windows-latest, area: dependencies }
          - { os: macos-latest, area: workflows }
          - { os: windows-latest, area: workflows }
          - { os: windows-latest, area: hook }
          - { os: macos-latest, area: mods }
          - { os: windows-latest, area: mods }
          - { os: macos-latest, area: fuzz }
          - { os: windows-latest, area: fuzz }
          - { os: macos-latest, area: fuzz-files }
          - { os: windows-latest, area: fuzz-files }
          - os: macos-latest
            area: ruff
          - os: windows-latest
            area: ruff
          - { os: macos-latest, area: shell }
          - { os: windows-latest, area: shell }
    runs-on: ${{ matrix.os }}
    env:
      AREA: ${{ matrix.area }}
      # Only licenses reads it; in every job's environment it would pass Windows' limit.
      CHANGED: ${{ matrix.area == 'licenses' && needs.changes.outputs.changed || null }}
    steps:
      - name: Check out
        run: |
          git init -q .
          git config core.autocrlf false
          git fetch -q --depth=2 "${URL}" "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD
      - name: Install Rust
        if: contains(fromJSON('["core","python","javascript","advisories","dependencies","fuzz","fuzz-files"]'), matrix.area)
        run: rustup toolchain install --no-self-update
      - name: Install the area's tools
        run: sh ci/setup.sh "${AREA}"
      - name: Run the checks
        run: sh ci/check.sh "${AREA}"
  ci:
    name: All checks pass
    needs: [changes, check]
    if: always()
    runs-on: ubuntu-latest
    env:
      CHANGES: ${{ needs.changes.result }}
      CHECK: ${{ needs.check.result }}
    steps:
      - name: Fail unless every check passed or was skipped
        run: |
          case "${CHANGES} ${CHECK}" in
            'success success' | 'success skipped') ;;
            *) exit 1 ;;
          esac
  tag:
    name: Tag the nightly
    needs: [changes, check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DATE: ${{ needs.changes.outputs.date }}
    steps:
      - name: Tag this commit unless it or the date is tagged
        run: |
          tags=$(git ls-remote --tags "${URL}" 'refs/tags/nightly-*')
          case ${tags} in
            *"${GITHUB_SHA}"* | *"refs/tags/nightly-${DATE}"*) exit 0 ;;
            *) ;;
          esac
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/nightly-${DATE}" -f sha="${GITHUB_SHA}"
  issue:
    name: Report a failed nightly
    needs: [changes, check]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DATE: ${{ needs.changes.outputs.date }}
    steps:
      - name: Open an issue unless a nightly one is open
        run: |
          open=$(gh issue list --label bug --limit 1000 --json title --jq '.[] | select(.title | startswith("Nightly ")) | .title')
          if [[ -z "${open}" ]]; then
            gh issue create --label bug --title "Nightly ${DATE} failed" --body "${URL}/actions/runs/${GITHUB_RUN_ID}"
          fi
