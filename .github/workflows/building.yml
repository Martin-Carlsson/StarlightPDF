name: Clear the building label
on:
  issues:
    types: [closed]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  unlabel:
    name: Remove the building label from a closed issue
    if: contains(github.event.issue.labels.*.name, 'building')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Remove the label
        run: gh issue edit "${NUMBER}" --remove-label building
