name: Mod versions
on:
  pull_request:
    paths:
      - '.claude/mods/**'
      - '.claude-plugin/**'
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  version:
    name: Check changed mods bump their version
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.base_ref }}
      PR: ${{ github.event.number }}
      TOKEN: ${{ github.token }}
      URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - name: Check out the merge result
        run: |
          git init -q .
          auth=$(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch -q --depth=1 "${URL}" \
            "+refs/heads/${BASE}:refs/remotes/origin/${BASE}" "+refs/pull/${PR}/merge:refs/remotes/pull/merge"
          git checkout -q --detach pull/merge
      - name: Test the version check
        run: sh .claude/mods/version.test.sh
      - name: Check versions against the base branch
        run: sh .claude/mods/version.sh "origin/${BASE}"
